description: 'The University of Florida’s Florida Institute for Built Environment Resilience (FIBER) focuses on research, education, and outreach to improve the resilience of built environments against climate change, natural hazards, and other stressors. It integrates interdisciplinary expertise in engineering, planning, and environmental science to develop innovative solutions, tools, and policies that enhance infrastructure durability, sustainability, and community well‑being across Florida and beyond.'

